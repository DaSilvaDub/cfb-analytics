name: Daily ingest

# Captures the market once a day so line movement has something to measure.
#
# 11:00 UTC = 7am ET, before the day's line moves. A consistent capture time
# matters more than the specific hour: day-over-day movement is only meaningful
# if each snapshot is taken at the same point in the daily cycle.
on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:
    inputs:
      season:
        description: "Season year (blank = current)"
        required: false
        type: string
      include_outlier:
        description: "Also try the Outlier leg (token expires after 24h)"
        required: false
        type: boolean
        default: false
      backfill_from:
        description: "One-off historical backfill start year (e.g. 2014). Leave blank for none."
        required: false
        type: string
      backfill_elo_from:
        description: "One-off weekly-Elo backfill start year (e.g. 2014). Leave blank for none."
        required: false
        type: string

concurrency:
  group: daily-ingest
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Restore database from the data branch
        run: |
          mkdir -p data
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git fetch --depth=1 origin data
            # Prefer gzip snapshot (under GitHub's 50 MB soft limit). Fall back to
            # legacy raw cfb.sqlite3 so the first run after this change still
            # bootstraps from the last uncompressed publish.
            if git cat-file -e FETCH_HEAD:cfb.sqlite3.gz 2>/dev/null; then
              git show FETCH_HEAD:cfb.sqlite3.gz | gunzip > data/cfb.sqlite3
              echo "restored $(stat -c%s data/cfb.sqlite3) bytes from cfb.sqlite3.gz"
            elif git cat-file -e FETCH_HEAD:cfb.sqlite3 2>/dev/null; then
              git show FETCH_HEAD:cfb.sqlite3 > data/cfb.sqlite3
              echo "restored $(stat -c%s data/cfb.sqlite3) bytes from legacy raw cfb.sqlite3"
            else
              echo "data branch has no cfb.sqlite3(.gz) - starting a fresh store"
            fi
          else
            echo "no data branch yet - starting a fresh store"
          fi

      - name: Migrate
        run: python -m cfb_analytics.cli init-db

      - name: Historical backfill (manual, one-off)
        # Deliberately NOT part of the daily path: twelve seasons of fetches
        # every morning would cost minutes and a pile of API calls for data
        # that never changes. The daily job bootstraps the CURRENT season only.
        if: ${{ github.event.inputs.backfill_from != '' }}
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          CFB_HTTP_MODE: live
        run: |
          YEAR_NOW=$(date -u +%Y)
          python -m cfb_analytics.cli backfill-cfbd             --start-year "${{ github.event.inputs.backfill_from }}" --end-year "$YEAR_NOW"

      - name: Historical Elo backfill (manual, one-off)
        # Weekly Elo rows were silently dropped by a schema bug for as long as
        # this table has existed (see the fix commit on parse_elo_rating /
        # insert_team_ratings). This is how the cloud data branch actually
        # picks the fix up -- a targeted re-fetch of the Elo endpoint only,
        # not a full backfill-cfbd/backfill-fundamentals re-run.
        if: ${{ github.event.inputs.backfill_elo_from != '' }}
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          CFB_HTTP_MODE: live
        run: |
          YEAR_NOW=$(date -u +%Y)
          python -m cfb_analytics.cli backfill-elo             --start-year "${{ github.event.inputs.backfill_elo_from }}" --end-year "$YEAR_NOW"

      - name: Daily ingest
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          OUTLIER_SESSION_JSON: ${{ secrets.OUTLIER_SESSION_JSON }}
          CFB_HTTP_MODE: live
        run: |
          # The Outlier leg is opt-in and best-effort: its access token lives
          # 24 hours and is refreshed by an interactive Playwright + email-OTP
          # login, so an unattended runner finds it expired on day two.
          ARGS=""
          if [ "${{ github.event.inputs.include_outlier }}" = "true" ] && [ -n "$OUTLIER_SESSION_JSON" ]; then
            mkdir -p "$RUNNER_TEMP/outlier_session"
            printf '%s' "$OUTLIER_SESSION_JSON" > "$RUNNER_TEMP/outlier_session/storage_state.json"
            export OUTLIER_SESSION_DIR="$RUNNER_TEMP/outlier_session"
            echo "Outlier leg enabled (session supplied)"
          else
            ARGS="--no-outlier"
            echo "Outlier leg disabled"
          fi
          if [ -n "${{ github.event.inputs.season }}" ]; then
            ARGS="$ARGS --season ${{ github.event.inputs.season }}"
          fi
          python -m cfb_analytics.cli daily $ARGS

      - name: Coverage report
        if: always()
        run: |
          {
            echo "## Book coverage"
            echo '```'
            python -m cfb_analytics.cli coverage || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish database
        if: always()
        run: |
          if [ ! -f data/cfb.sqlite3 ]; then
            echo "no database to publish"; exit 0
          fi

          # WAL mode (see db._connect) keeps recent commits in a `-wal`
          # sidecar file until something checkpoints them into the main
          # file. open_db() already does this unconditionally on every
          # close, but this step reads data/cfb.sqlite3 as a raw file, not
          # through sqlite3, so it must not simply trust that already
          # happened. Then refuse to publish outright if the result looks
          # empty -- this exact failure mode (a valid SQLite header, zero
          # tables) previously reached the data branch with no error from
          # anything. See tests/test_db_and_store.py::TestWalCheckpointOnClose.
          cat > "$RUNNER_TEMP/checkpoint_and_verify.py" <<'PYEOF'
          import sqlite3
          import sys
          conn = sqlite3.connect("data/cfb.sqlite3")
          conn.execute("PRAGMA wal_checkpoint(TRUNCATE)")
          tables = conn.execute("SELECT name FROM sqlite_master WHERE type='table'").fetchall()
          if not tables:
              print("REFUSING TO PUBLISH: database has zero tables", file=sys.stderr)
              sys.exit(1)
          games = conn.execute("SELECT COUNT(*) FROM games").fetchone()[0]
          print(f"integrity check ok: {len(tables)} tables, {games} games")
          conn.close()
          PYEOF
          python "$RUNNER_TEMP/checkpoint_and_verify.py"

          # Single-commit orphan branch, force-pushed. The database is itself an
          # append-only history, so keeping git history of the binary too would
          # grow the repo without adding information.
          #
          # Publish gzip-compressed: raw cfb.sqlite3 already exceeds GitHub's
          # 50 MB soft limit (~58 MB on 2026-09-24) and the push started failing
          # with remote Internal Server Error after the GH001 large-file warning.
          # Consumers (this workflow's Restore step) gunzip back to data/cfb.sqlite3.
          RAW_BYTES=$(stat -c%s data/cfb.sqlite3)
          rm -rf "$RUNNER_TEMP/pub" && mkdir -p "$RUNNER_TEMP/pub"
          gzip -c -6 data/cfb.sqlite3 > "$RUNNER_TEMP/pub/cfb.sqlite3.gz"
          GZ_BYTES=$(stat -c%s "$RUNNER_TEMP/pub/cfb.sqlite3.gz")
          cd "$RUNNER_TEMP/pub"
          git init -q
          # Identity must be set HERE. This is a brand-new repository; config
          # applied to the checkout above does not reach it, and the runner has
          # no global identity, so the commit fails with "empty ident name".
          git config user.name "cfb-analytics"
          git config user.email "114450970+DaSilvaDub@users.noreply.github.com"
          git checkout -q -b data
          {
            echo "# Data branch"
            echo
            echo "Single-commit snapshot of \`cfb.sqlite3.gz\` (gzip of \`data/cfb.sqlite3\`),"
            echo "force-pushed by the Daily ingest workflow. Not source; see \`master\` for code."
            echo
            echo "Restore: \`git show origin/data:cfb.sqlite3.gz | gunzip > data/cfb.sqlite3\`"
            echo
            echo "Last updated: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "Raw size: ${RAW_BYTES} bytes"
            echo "Gzip size: ${GZ_BYTES} bytes"
          } > README.md
          git add cfb.sqlite3.gz README.md
          git commit -q -m "data: snapshot $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data:data
          echo "published ${GZ_BYTES} gzip bytes (raw ${RAW_BYTES}) to the data branch"
