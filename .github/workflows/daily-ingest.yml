name: Daily ingest

# Captures the market once a day so line movement has something to measure.
#
# 11:00 UTC = 7am ET, before the day's line moves. A consistent capture time
# matters more than the specific hour: day-over-day movement is only meaningful
# if each snapshot is taken at the same point in the daily cycle.
on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:
    inputs:
      season:
        description: "Season year (blank = current)"
        required: false
        type: string
      include_outlier:
        description: "Also try the Outlier leg (token expires after 24h)"
        required: false
        type: boolean
        default: false
      backfill_from:
        description: "One-off historical backfill start year (e.g. 2014). Leave blank for none."
        required: false
        type: string

concurrency:
  group: daily-ingest
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Restore database from the data branch
        run: |
          mkdir -p data
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git fetch --depth=1 origin data
            git show FETCH_HEAD:cfb.sqlite3 > data/cfb.sqlite3
            echo "restored $(stat -c%s data/cfb.sqlite3) bytes from the data branch"
          else
            echo "no data branch yet - starting a fresh store"
          fi

      - name: Migrate
        run: python -m cfb_analytics.cli init-db

      - name: Historical backfill (manual, one-off)
        # Deliberately NOT part of the daily path: twelve seasons of fetches
        # every morning would cost minutes and a pile of API calls for data
        # that never changes. The daily job bootstraps the CURRENT season only.
        if: ${{ github.event.inputs.backfill_from != '' }}
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          CFB_HTTP_MODE: live
        run: |
          YEAR_NOW=$(date -u +%Y)
          python -m cfb_analytics.cli backfill-cfbd             --start-year "${{ github.event.inputs.backfill_from }}" --end-year "$YEAR_NOW"

      - name: Daily ingest
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          OUTLIER_SESSION_JSON: ${{ secrets.OUTLIER_SESSION_JSON }}
          CFB_HTTP_MODE: live
        run: |
          # The Outlier leg is opt-in and best-effort: its access token lives
          # 24 hours and is refreshed by an interactive Playwright + email-OTP
          # login, so an unattended runner finds it expired on day two.
          ARGS=""
          if [ "${{ github.event.inputs.include_outlier }}" = "true" ] && [ -n "$OUTLIER_SESSION_JSON" ]; then
            mkdir -p "$RUNNER_TEMP/outlier_session"
            printf '%s' "$OUTLIER_SESSION_JSON" > "$RUNNER_TEMP/outlier_session/storage_state.json"
            export OUTLIER_SESSION_DIR="$RUNNER_TEMP/outlier_session"
            echo "Outlier leg enabled (session supplied)"
          else
            ARGS="--no-outlier"
            echo "Outlier leg disabled"
          fi
          if [ -n "${{ github.event.inputs.season }}" ]; then
            ARGS="$ARGS --season ${{ github.event.inputs.season }}"
          fi
          python -m cfb_analytics.cli daily $ARGS

      - name: Coverage report
        if: always()
        run: |
          {
            echo "## Book coverage"
            echo '```'
            python -m cfb_analytics.cli coverage || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish database
        if: always()
        run: |
          if [ ! -f data/cfb.sqlite3 ]; then
            echo "no database to publish"; exit 0
          fi
          git config user.name "cfb-analytics"
          git config user.email "114450970+DaSilvaDub@users.noreply.github.com"
          # Single-commit orphan branch, force-pushed. The database is itself an
          # append-only history, so keeping git history of the binary too would
          # grow the repo without adding information.
          rm -rf "$RUNNER_TEMP/pub" && mkdir -p "$RUNNER_TEMP/pub"
          cp data/cfb.sqlite3 "$RUNNER_TEMP/pub/cfb.sqlite3"
          cd "$RUNNER_TEMP/pub"
          git init -q
          git checkout -q -b data
          {
            echo "# Data branch"
            echo
            echo "Single-commit snapshot of \`data/cfb.sqlite3\`, force-pushed by"
            echo "the Daily ingest workflow. Not source; see \`master\` for code."
            echo
            echo "Last updated: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > README.md
          git add cfb.sqlite3 README.md
          git commit -q -m "data: snapshot $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data:data
          echo "published $(stat -c%s cfb.sqlite3) bytes to the data branch"
