name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check .
      - name: Typecheck
        run: python -m mypy cfb_analytics
      - name: Test
        # CFB_HTTP_MODE=replay guarantees no test reaches the network: a cache
        # miss raises rather than falling through to a live request.
        env:
          CFB_HTTP_MODE: replay
        run: python -m pytest --cov=cfb_analytics --cov-report=term-missing
